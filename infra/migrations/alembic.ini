# Alembic stub for OneMarket Analyzer (infra-owned).
# Backend agent: point script_location at backend alembic tree if you relocate it,
# or keep migrations versioned here under infra/migrations/versions/.
[alembic]
script_location = ./infra/migrations
prepend_sys_path = ./backend
version_path_separator = os
sqlalchemy.url = postgresql+psycopg://onemarket:change-me@localhost:5432/onemarket

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
