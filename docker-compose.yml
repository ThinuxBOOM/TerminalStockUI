services:
  postgres:
    image: postgres:16
    container_name: onemarket-postgres
    restart: unless-stopped
    env_file:
      - path: ./infra/docker/.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onemarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onemarket_dev}
      POSTGRES_DB: ${POSTGRES_DB:-onemarket}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-onemarket} -d $${POSTGRES_DB:-onemarket}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7
    container_name: onemarket-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    # Persist cache/queue + provider-health state across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: onemarket-backend
    restart: unless-stopped
    env_file:
      - path: ./infra/docker/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://onemarket:onemarket_dev@postgres:5432/onemarket}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-env}
      CRON_SECRET: ${CRON_SECRET:-}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Bounded probe: 3s socket timeout so a refused/slow /health never hangs
      # the 15s interval and flaps the frontend depends_on gate. Exits 0 only
      # on HTTP 200; connection errors exit non-zero (unhealthy) via the shell.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: onemarket-frontend
    restart: unless-stopped
    env_file:
      - path: ./infra/docker/.env
        required: false
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # vite preview takes ~60s on first boot (npm build + preview). wget with
      # a 3s fetch timeout avoids hanging the interval; longer start_period
      # stops the flap where compose marks the frontend unhealthy mid-build.
      test: ["CMD-SHELL", "wget -T 3 -qO- http://127.0.0.1:5173 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  pgdata:
  redisdata:
