# CI-only overlay: a local Postgres stands in for Supabase so the whole stack
# (Caddy, backend, Redis, scheduler) can boot on a GitHub runner.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ci
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
