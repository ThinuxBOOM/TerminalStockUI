<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OneMarket Analyzer Terminal - multi-market stock analysis with deterministic forecasts" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- V2 compliant ads: connection warm-up for AdSense origins. -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
    <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin />
    <!-- AdSense loader: plain async <script>, NEVER Vite-bundled/imported.
         Zero-traffic starter: replace ca-pub-XXXXXXXXXXXXXXXX with the real
         publisher ID (same value as VITE_ADS_CLIENT_ID in frontend/.env)
         once AdSense onboarding completes. Until then <AdSlot/> renders its
         labeled reserve but performs zero ad pushes. -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>OneMarket Analyzer — Easy Stock Insights for Everyone</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime backend-URL config (no-rebuild knob): edit public/config.js
         in dev or dist/config.js after build. See src/api/baseUrl.js. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
