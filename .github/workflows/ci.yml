name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      # conftest.py makes the run hermetic: temp SQLite, no credentials, no network.
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - run: psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -f deploy/ci/supabase_shim.sql
      - run: python scripts/migrate.py up
      - run: python scripts/migrate.py up   # second run must be a no-op
      - run: psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/seed.sql

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          printf 'DOMAIN=:80\nCRON_SECRET=ci\n' > .env
          docker compose config --quiet
      - run: docker compose build
